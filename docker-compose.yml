services:
  # Base vectorielle Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # Backend (API FastAPI)
  api:
    build: .
    container_name: rag_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data # Documents PDF
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    depends_on:
      - qdrant

  # Frontend (Interface Streamlit)
  streamlit : 
    build: .
    container_name: rag_streamlit_frontend
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - API_URL=http://api:8000
    volumes:
      - ./data:/app/data
    command: streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
