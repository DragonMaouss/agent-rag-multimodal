services:
  api:
    build: .
    container_name: rag_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./chroma_multimodal_db:/app/chroma_multimodal_db
      - ./data:/app/data
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

  streamlit : 
    build: .
    container_name: rag_streamlit_frontend
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - API_URL=http://api:8000
    volumes:
      - ./data:/app/data
    command: streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
